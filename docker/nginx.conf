server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4G;

    # ------------------------------------------------------------------
    # Static, regenerable assets that nginx should serve straight from disk
    # instead of proxying through the Bun backend. These are the biggest
    # win for the "slow loading" symptom.
    # ------------------------------------------------------------------

    # Thumbnails: /api/media/{id}/thumbnail  ->  /data/thumbnails/{id}.webp
    # Immutable, so they cache forever in the browser.
    location ~ ^/api/media/(\d+)/thumbnail$ {
        alias /data/thumbnails/$1.webp;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        default_type image/webp;
        try_files "" =404;
    }

    # Original media files: /api/media/{id}/file
    # Keep proxied (paths are DB-driven and env-specific). Add Range support +
    # a longer timeout so big videos stream reliably through nginx.
    location ~ ^/api/media/(\d+)/file$ {
        proxy_pass http://server:3777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header X-Range $http_range;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
    }

    # Everything else under /api goes to the backend.
    location /api/ {
        proxy_pass http://server:3777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/job progress streams must NOT be buffered or time out.
        # Only pathological for the streaming routes, but keeping it off here is
        # simplest and those routes are not performance-critical.
        proxy_read_timeout 1d;
        proxy_set_header Connection '';
    }

    location / {
        try_files $uri /index.html;
    }
}
