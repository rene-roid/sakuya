server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4G;

    # Serve thumbnails straight from disk, skipping the Bun proxy entirely.
    # This is the main fix for slow grid/thumbnail loading: the file is small
    # (<512px webp) and immutable, so it feels instant and caches forever.
    location ~ ^/api/media/(\d+)/thumbnail$ {
        alias /data/thumbnails/$1.webp;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        default_type image/webp;
        try_files "" =404;
    }

    # Original media (videos/images). Kept proxied since DB paths are
    # environment-specific, but with Range support + long timeouts so big
    # videos stream reliably through nginx.
    location ~ ^/api/media/(\d+)/file$ {
        proxy_pass http://server:3777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header X-Range $http_range;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://server:3777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_set_header Connection '';
    }

    location / {
        try_files $uri /index.html;
    }
}
