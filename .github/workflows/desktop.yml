name: Desktop

# Builds both installers as workflow artifacts. release.yml calls it to build a release's tag;
# running it by hand or marking a PR that touches the desktop app ready for review just builds them.
# Pushes to an open PR do not rebuild, so commits on a PR don't each cost two builds.
on:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to build.
        required: true
        type: string
  pull_request:
    types: [ready_for_review]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # inputs.ref is empty outside workflow_call, which checks out the event's own commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The full install is only for the web build; stage.sh installs the production set it ships.
      - run: bun install --frozen-lockfile

      - run: npm ci
        working-directory: desktop

      # Native modules (sharp, onnxruntime) are per-OS, which is why each installer builds on its own OS.
      - run: bash desktop/stage.sh

      - run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$(bun -e 'console.log(require("../package.json").version)')"
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: sakuya-${{ runner.os }}
          # latest*.yml and the blockmaps are what electron-updater reads to find and verify updates.
          path: |
            desktop/dist/Sakuya-*.AppImage
            desktop/dist/Sakuya-*.exe
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
