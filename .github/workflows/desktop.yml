name: Desktop

# A v* tag builds both installers and attaches them to that tag's GitHub release; running it by hand
# (or a PR touching the desktop app) just builds them as workflow artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The full install is only for the web build; stage.sh installs the production set it ships.
      - run: bun install --frozen-lockfile

      - run: npm ci
        working-directory: desktop

      # Native modules (sharp, onnxruntime) are per-OS, which is why each installer builds on its own OS.
      - run: bash desktop/stage.sh

      - run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$(bun -e 'console.log(require("../package.json").version)')"
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: sakuya-${{ runner.os }}
          path: |
            desktop/dist/Sakuya-*.AppImage
            desktop/dist/Sakuya-*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" Sakuya-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
